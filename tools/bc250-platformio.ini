; Tracked BC250 release-build configuration, copied as platformio_override.ini.
[platformio]
default_envs = bc250_power

[env:bc250_power]
extends = env:esp32dev
custom_usermods = BC250Power
build_flags = ${env:esp32dev.build_flags}
  -D DATA_PINS=19
  -D LEDPIN=19
  -D BTNPIN=-1
  -D RLYPIN=-1
  -D IRPIN=-1
  -D AUDIOPIN=-1
  -D WLED_DISABLE_INFRARED
  -D WLED_DEBUG
  -D WLED_DEBUG_HOST='"192.168.50.146"'
